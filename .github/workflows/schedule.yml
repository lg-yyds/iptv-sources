name: update schedule
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:   # 建议加上，方便手动触发

permissions:
  contents: write
  actions: write       # 清理运行记录需要

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: install yarn
        run: npm install yarn -g

      - run: yarn install
      - run: yarn build
      - run: yarn m3u

      - name: "Jekyll theme"
        run: mv ./_config.temp.yml ./m3u/_config.yml

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./m3u
          enable_jekyll: true
          cname: lg-yyds.github.io

      # ========== 新增：清理旧的工作流运行记录 ==========
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
